<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="100%" height="100%">
  <rect width="60" height="40" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Checkered flag pattern -->
  <rect x="0" y="0" width="15" height="10" fill="#0f172a"/>
  <rect x="30" y="0" width="15" height="10" fill="#0f172a"/>
  <rect x="15" y="10" width="15" height="10" fill="#0f172a"/>
  <rect x="45" y="10" width="15" height="10" fill="#0f172a"/>
  <rect x="0" y="20" width="15" height="10" fill="#0f172a"/>
  <rect x="30" y="20" width="15" height="10" fill="#0f172a"/>
  <rect x="15" y="30" width="15" height="10" fill="#0f172a"/>
  <rect x="45" y="30" width="15" height="10" fill="#0f172a"/>
</svg>